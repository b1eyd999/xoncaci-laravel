---
deployment:
  tasks:
    - export APPPATH=/home/darkftga/xonca-laravel
    - export WEBROOT=/home/darkftga/public_html/xoncaci.az
    - export PHPBIN=$(command -v ea-php82 || echo /opt/cpanel/ea-php82/root/usr/bin/php)
    - /bin/mkdir -p $APPPATH $WEBROOT
    # Mirror the checkout into the app folder. What exists only on the server
    # is excluded, or --delete would take it: .env (keys and passwords), the
    # storage folder (uploaded photos, logs, sessions) and the SQLite file.
    - if command -v rsync >/dev/null 2>&1; then rsync -a --delete --exclude .git --exclude '.env*' --exclude storage/ --exclude public/ --exclude bootstrap/cache/ --exclude 'database/*.sqlite' ./ $APPPATH/; else /bin/cp -R * $APPPATH; fi
    - /bin/rm -rf $APPPATH/public
    - /bin/mkdir -p $APPPATH/storage/app/public $APPPATH/storage/framework/cache/data $APPPATH/storage/framework/sessions $APPPATH/storage/framework/views $APPPATH/storage/logs $APPPATH/bootstrap/cache
    - /usr/bin/touch $APPPATH/database/database.sqlite
    # Only index.php may be a PHP file in the web root.
    - /usr/bin/find $WEBROOT -maxdepth 1 -type f -name '*.php' ! -name index.php -delete
    - /bin/cp -R public/* $WEBROOT/
    - /bin/cp public/.htaccess $WEBROOT/ 2>/dev/null || true
    - /bin/ln -sfn $APPPATH/storage/app/public $WEBROOT/storage
    - /bin/rm -f $APPPATH/bootstrap/cache/config.php $APPPATH/bootstrap/cache/routes-v7.php $APPPATH/bootstrap/cache/services.php $APPPATH/bootstrap/cache/packages.php
    - /bin/rm -rf $APPPATH/storage/framework/views/*.php
    # No SSH on this account, so every release migrates itself; the starting
    # catalogue is written only into an empty database.
    - cd $APPPATH && $PHPBIN artisan migrate --force >> $APPPATH/storage/logs/deploy.log 2>&1
    - cd $APPPATH && $PHPBIN artisan xonca:install >> $APPPATH/storage/logs/deploy.log 2>&1
    - cd $APPPATH && $PHPBIN artisan cache:clear >> $APPPATH/storage/logs/deploy.log 2>&1
    # Compiled config, views and Filament's components: pages answer far
    # sooner. Runs after xonca:install, which still reads .env directly.
    - cd $APPPATH && $PHPBIN artisan config:cache >> $APPPATH/storage/logs/deploy.log 2>&1
    - cd $APPPATH && $PHPBIN artisan view:cache >> $APPPATH/storage/logs/deploy.log 2>&1
    - cd $APPPATH && $PHPBIN artisan filament:optimize >> $APPPATH/storage/logs/deploy.log 2>&1
